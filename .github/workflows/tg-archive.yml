name: Archive Telegram Channel

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tg-archive pyyaml telethon

      - name: Prepare Session and Config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          python3 -c '
          import os
          import yaml
          from telethon.sessions import StringSession
          from telethon.sync import TelegramClient

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          
          # Clean and fix Base64 padding for TG_SESSION_STRING
          raw_session = os.environ["TG_SESSION_STRING"].strip().replace("\n", "").replace("\r", "")
          missing_padding = len(raw_session) % 4
          if missing_padding:
              raw_session += "=" * (4 - missing_padding)

          # 1. Test connection with fixed session
          client = TelegramClient(StringSession(raw_session), api_id, api_hash)
          client.connect()
          
          # Save standard Telethon session file
          session_file = "telegram.session"
          with open(session_file, "w") as f:
              f.write(client.session.save())
          client.disconnect()

          # 2. Generate config.yaml
          config = {
              "api_id": api_id,
              "api_hash": api_hash,
              "channel": "pelajarsunnahid", # GANTI dengan username channel Telegram (tanpa @)
              "data_dir": "data",
              "publish_dir": "site"
          }
          with open("config.yaml", "w") as f:
              yaml.dump(config, f)
          '
