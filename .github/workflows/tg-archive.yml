name: Archive Telegram Channel & Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tg-archive pyyaml telethon

      - name: Create Output Directories
        run: |
          mkdir -p data site
          touch data/.gitkeep site/.gitkeep

      - name: Create Config and Session
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          python3 -c '
          import os
          import base64
          import yaml
          from telethon.sessions import StringSession, SQLiteSession

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          session_str = os.environ["TG_SESSION_STRING"].strip()

          # Jika secret berupa StringSession Telethon (dimulai angka 1...):
          try:
              ss = StringSession(session_str)
              sq = SQLiteSession("telegram.session")
              sq.save(ss)
              sq.close()
          except Exception:
              # Jika secret berupa file binary sqlite yang di-base64:
              with open("telegram.session", "wb") as f:
                  f.write(base64.b64decode(session_str))

          config = {
              "api_id": api_id,
              "api_hash": api_hash,
              "group": "pelajarsunnahid",
              "data_dir": "data",
              "publish_dir": "site"
          }
          with open("config.yaml", "w") as f:
              yaml.dump(config, f)
          '

      - name: Download Official Template & Static Assets
        run: |
          curl -sL https://raw.githubusercontent.com/knadh/tg-archive/master/tgarchive/templates/template.html -o template.html
          mkdir -p static
          curl -sL https://raw.githubusercontent.com/knadh/tg-archive/master/tgarchive/static/style.css -o static/style.css
          curl -sL https://raw.githubusercontent.com/knadh/tg-archive/master/tgarchive/static/index.js -o static/index.js || true

      - name: Run tg-archive Sync
        run: |
          tg-archive --config config.yaml -se telegram.session -s

      - name: Build Static Site & Generate index.html
        run: |
          tg-archive --config config.yaml -b
          
          LATEST_HTML=$(ls site/*.html 2>/dev/null | grep -E '[0-9]{4}-[0-9]{2}\.html$' | sort -r | head -n 1)
          if [ -n "$LATEST_HTML" ]; then
            cp "$LATEST_HTML" site/index.html
          fi

          touch site/.nojekyll

      - name: Commit and Push Updated Data & Site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/ template.html static/
          git commit -m "chore: update telegram raw data, site, and assets" || exit 0
          git push

      - name: Upload Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
