name: Archive Telegram Channel

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tg-archive pyyaml

      - name: Create Output Directories and Bypass Jekyll
        run: |
          mkdir -p data docs
          touch data/.gitkeep docs/.gitkeep docs/.nojekyll

      - name: Decode Session File and Create Config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          python3 -c '
          import os
          import base64
          import sqlite3
          import yaml

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          session_b64 = os.environ["TG_SESSION_STRING"].strip()

          # Decode file .session dari Base64
          session_path = "telegram.session"
          with open(session_path, "wb") as f:
              f.write(base64.b64decode(session_b64))

          # Fix skema SQLite untuk kompatibilitas Telethon & tg-archive
          conn = sqlite3.connect(session_path)
          c = conn.cursor()
          c.execute("SELECT * FROM sessions")
          row = c.fetchone()
          if row and len(row) > 5:
              dc_id, server, port, auth_key = row[0], row[1], row[2], row[3]
              c.execute("DROP TABLE sessions")
              c.execute("CREATE TABLE sessions (dc_id integer primary key, server_address text, port integer, auth_key blob, take_out_id integer)")
              c.execute("INSERT INTO sessions VALUES (?, ?, ?, ?, 0)", (dc_id, server, port, auth_key))
              conn.commit()
          conn.close()

          # Buat config.yaml
          config = {
              "api_id": api_id,
              "api_hash": api_hash,
              "group": "pelajarsunnahid",
              "data_dir": "data",
              "publish_dir": "docs"
          }
          with open("config.yaml", "w") as f:
              yaml.dump(config, f)
          '

      - name: Run tg-archive Sync & Build
        run: |
          tg-archive --config config.yaml -se telegram.session -s -b

      - name: Ensure .nojekyll Exists
        run: |
          touch docs/.nojekyll

      - name: Commit and Push Results to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git commit -m "chore: update site build with .nojekyll" || exit 0
          git push
