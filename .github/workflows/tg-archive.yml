name: Archive Telegram Channel

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tg-archive
        run: |
          python -m pip install --upgrade pip
          pip install tg-archive

      - name: Create tg-archive Config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          cat <<EOF > config.yaml
          api_id: $TG_API_ID
          api_hash: "$TG_API_HASH"
          session_string: "$TG_SESSION_STRING"
          
          # Ganti 'namachannel' dengan username/link channel Telegram Anda (tanpa @)
          channel: "pelajarsunnahid" 
          
          publish_dir: "site"
          data_dir: "data"
          EOF

      - name: Run tg-archive Sync & Build
        run: |
          # Flag -s untuk Sync (download data) dan -b untuk Build (buat file site HTML)
          tg-archive --config config.yaml -s -b

      - name: Commit and Push Results to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          git commit -m "chore: update telegram archive data" || exit 0
          git push
