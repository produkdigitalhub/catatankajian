name: Archive Telegram Channel

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tg-archive pyyaml telethon

      - name: Prepare Session and Config
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          python3 -c '
          import os
          import yaml
          from telethon.sessions import StringSession
          from telethon.sync import TelegramClient

          api_id = int(os.environ["TG_API_ID"])
          api_hash = os.environ["TG_API_HASH"]
          session_string = os.environ["TG_SESSION_STRING"].strip()

          # 1. Buat file .session fisik dari StringSession
          client = TelegramClient(StringSession(session_string), api_id, api_hash)
          client.connect()
          
          # Simpan sebagai file session standar telethon
          session_file = "telegram.session"
          with open(session_file, "w") as f:
              f.write(client.session.save())
          client.disconnect()

          # 2. Buat config.yaml
          config = {
              "api_id": api_id,
              "api_hash": api_hash,
              "channel": pelajarsunnahid, # GANTI dengan username channel Telegram (tanpa @)
              "data_dir": "data",
              "publish_dir": "site"
          }
          with open("config.yaml", "w") as f:
              yaml.dump(config, f)
          '

      - name: Run tg-archive Sync & Build
        run: |
          # Lewatkan file session yang sudah dikonversi via flag -se
          tg-archive --config config.yaml -se telegram.session -s -b

      - name: Commit and Push Results to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          git commit -m "chore: update telegram archive data" || exit 0
          git push
